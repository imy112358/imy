<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="每日信息台，聚合今日天气、新闻 60 秒和摸鱼日历。">
  <meta name="color-scheme" content="light dark">
  <title>日常信息台</title>
  <link rel="stylesheet" href="./assets/css/site.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="./index.html" aria-label="日常信息台首页">
        <span class="brand-mark">今</span>
        <span>日常信息台</span>
      </a>
      <nav class="main-nav" aria-label="主要导航">
        <a class="nav-link" href="./weather.html">天气</a>
        <a class="nav-link" href="./news.html">新闻</a>
        <a class="nav-link" href="./moyu.html">日历</a>
        <a class="nav-link" href="./code-transfer.html">代码</a>
      </nav>
      <button class="theme-toggle" type="button" data-theme-toggle>深色</button>
    </div>
  </header>

  <main id="main" class="page">
    <section class="home-hero">
      <div class="hero-copy reveal">
        <p class="eyebrow">Daily briefing</p>
        <h1 class="hero-title">今天，<br class="mobile-break">先看重要的</h1>
        <p class="hero-subtitle">天气、要闻和休息倒计时，三分钟掌握今天。</p>
        <div class="hero-actions">
          <a class="button" href="#today">查看今日信息</a>
          <a class="button secondary" href="./news.html">阅读新闻</a>
        </div>
      </div>
      <div class="hero-visual reveal" style="animation-delay: 100ms">
        <article class="date-poster" aria-label="今日日期">
          <div class="date-poster-month" id="poster-month">October</div>
          <div class="date-poster-day" id="poster-day">29</div>
          <div class="date-poster-weekday" id="poster-weekday">星期四</div>
          <div class="date-poster-note" id="poster-full-date">2026年10月29日</div>
        </article>
      </div>
    </section>

    <section class="section" id="today">
      <div class="section-heading">
        <h2>今天的三个切面</h2>
        <p>实时数据优先，网络异常时自动显示最近一次缓存。</p>
      </div>

      <div class="dashboard-grid">
        <article class="panel weather-preview" id="home-weather">
          <div class="panel-inner">
            <div class="panel-top">
              <span class="panel-label">今日天气</span>
              <a class="panel-link" href="./weather.html">查看详情</a>
            </div>
            <div class="state">
              <div class="skeleton skeleton-line short"></div>
              <div class="skeleton" style="width: 48%; height: 92px"></div>
              <div class="skeleton skeleton-line"></div>
            </div>
          </div>
        </article>

        <article class="panel news-preview" id="home-news">
          <div class="panel-inner">
            <div class="panel-top">
              <span class="panel-label">新闻 60 秒</span>
              <a class="panel-link" href="./news.html">全部要闻</a>
            </div>
            <div class="state">
              <div class="skeleton skeleton-block"></div>
              <div class="skeleton skeleton-line"></div>
              <div class="skeleton skeleton-line short"></div>
            </div>
          </div>
        </article>

        <article class="panel moyu-preview" id="home-moyu">
          <div class="panel-inner">
            <div class="panel-top">
              <span class="panel-label">摸鱼日历</span>
              <a class="panel-link" href="./moyu.html">查看日历</a>
            </div>
            <div class="state compact">
              <div class="skeleton skeleton-line short"></div>
              <div class="skeleton skeleton-line"></div>
              <div class="skeleton skeleton-line"></div>
            </div>
          </div>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>© <span data-current-year></span> 日常信息台</span>
    <span>数据来自 <a href="https://60s.viki.moe" target="_blank" rel="noreferrer">VikiMoe 60s</a></span>
  </footer>

  <script src="./assets/js/common.js"></script>
  <script src="./assets/js/home.js"></script>
</body>
</html>
