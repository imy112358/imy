<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="每日信息台，聚合今日天气、新闻 60 秒和摸鱼日历。">
  <meta name="color-scheme" content="light dark">
  <title>日常信息台</title>
  <link rel="stylesheet" href="./assets/css/site.css?v=20261030-ui">
  <link rel="stylesheet" href="./assets/css/workspace.css?v=20261030-ui">
  <script src="./assets/js/navigation.js?v=20261030-ui" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header" data-site-navigation></header>

  <main id="main" class="page">
    <section class="home-hero">
      <div class="hero-copy">
        <p class="eyebrow">我的日常</p>
        <h1 class="hero-title">今天，也从容一点。</h1>
        <p class="home-date" id="poster-full-date"></p>
      </div>
      <article class="date-poster" aria-label="今日日期">
        <div class="date-poster-month" id="poster-month"></div>
        <div class="date-poster-day" id="poster-day"></div>
        <div class="date-poster-weekday" id="poster-weekday"></div>
      </article>
    </section>

    <section class="section" id="today">
      <div class="section-heading">
        <h2>今日概览</h2>
      </div>

      <div class="dashboard-grid">
        <article class="panel weather-preview" id="home-weather">
          <div class="panel-inner">
            <div class="panel-top">
              <span class="panel-label">今日天气</span>
              <a class="panel-link" href="./weather.html">查看详情</a>
            </div>
            <div class="state">
              <div class="skeleton skeleton-line short"></div>
              <div class="skeleton" style="width: 48%; height: 92px"></div>
              <div class="skeleton skeleton-line"></div>
            </div>
          </div>
        </article>

        <article class="panel news-preview" id="home-news">
          <div class="panel-inner">
            <div class="panel-top">
              <span class="panel-label">新闻 60 秒</span>
              <a class="panel-link" href="./news.html">全部要闻</a>
            </div>
            <div class="state">
              <div class="skeleton skeleton-block"></div>
              <div class="skeleton skeleton-line"></div>
              <div class="skeleton skeleton-line short"></div>
            </div>
          </div>
        </article>

        <article class="panel moyu-preview" id="home-moyu">
          <div class="panel-inner">
            <div class="panel-top">
              <span class="panel-label">摸鱼日历</span>
              <a class="panel-link" href="./moyu.html">查看日历</a>
            </div>
            <div class="state compact">
              <div class="skeleton skeleton-line short"></div>
              <div class="skeleton skeleton-line"></div>
              <div class="skeleton skeleton-line"></div>
            </div>
          </div>
        </article>
        <a class="panel tool-preview" href="./code-transfer.html">
          <span class="panel-label">随手工具</span>
          <span class="tool-symbol" aria-hidden="true">&lt;/&gt;</span>
          <span class="tool-bottom"><strong>代码中转站</strong><span aria-hidden="true">↗</span></span>
        </a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>© <span data-current-year></span> 日常信息台</span>
    <span>数据来自 <a href="https://60s.viki.moe" target="_blank" rel="noreferrer">VikiMoe 60s</a></span>
  </footer>

  <script src="./assets/js/common.js"></script>
  <script src="./assets/js/home.js"></script>
</body>
</html>
