<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="公共代码中转站，在不同设备间保存、查看和复制代码。">
  <meta name="color-scheme" content="light dark">
  <script>
    if (location.protocol === 'http:' && /(^|\.)aifather\.top$/i.test(location.hostname)) {
      location.replace('https://' + location.host + location.pathname + location.search + location.hash);
    }
  </script>
  <title>代码中转站 | 日常信息台</title>
  <link rel="stylesheet" href="./assets/css/site.css?v=20261030-ui">
  <link rel="stylesheet" href="./assets/css/workspace.css?v=20261030-ui">
  <script src="./assets/js/navigation.js?v=20261030-ui" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header" data-site-navigation></header>

  <main id="main" class="page code-page">
    <header class="page-head code-page-head reveal">
      <div class="page-head-copy">
        <a class="back-link" href="./index.html">返回首页</a>
        <h1 class="page-title">公共代码库</h1>
      </div>
      <div class="page-actions">
        <button class="button" id="new-snippet" type="button">新建代码</button>
      </div>
    </header>

    <section class="cloud-code-layout" aria-label="公共代码库">
      <aside class="snippet-sidebar">
        <div class="snippet-sidebar-head">
          <label class="visually-hidden" for="snippet-search">搜索代码</label>
          <input class="snippet-search" id="snippet-search" type="search" placeholder="搜索标题或语言" autocomplete="off">
          <span class="snippet-total" id="snippet-total">正在连接云端</span>
        </div>
        <div class="snippet-list" id="snippet-list" aria-live="polite">
          <div class="snippet-list-state">正在读取公共代码...</div>
        </div>
      </aside>

      <section class="code-workspace cloud-editor" aria-label="代码编辑器">
        <div class="code-toolbar cloud-code-toolbar">
          <div class="snippet-fields">
            <div class="snippet-field snippet-title-field">
              <label for="snippet-title">标题</label>
              <input id="snippet-title" maxlength="200" placeholder="未命名代码" autocomplete="off">
            </div>
            <div class="snippet-field">
              <label for="snippet-language">语言</label>
              <select id="snippet-language">
                <option value="plaintext">纯文本</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="javascript">JavaScript</option>
                <option value="typescript">TypeScript</option>
                <option value="python">Python</option>
                <option value="java">Java</option>
                <option value="php">PHP</option>
                <option value="sql">SQL</option>
                <option value="json">JSON</option>
                <option value="shell">Shell</option>
                <option value="other">其他</option>
              </select>
            </div>
          </div>
          <div class="code-actions">
            <button class="button secondary small" id="delete-snippet" type="button" disabled>删除</button>
            <button class="button secondary small" id="copy-code" type="button">复制代码</button>
            <button class="button small" id="save-snippet" type="button">保存到云端</button>
          </div>
        </div>

        <div class="code-editor-shell">
          <div class="code-gutter" aria-hidden="true" id="line-numbers">1</div>
          <textarea
            class="code-input"
            id="code-input"
            aria-describedby="code-helper"
            aria-label="代码内容"
            placeholder="在这里粘贴代码…"
            spellcheck="false"
            autocorrect="off"
            autocapitalize="off"
            autocomplete="off"
            wrap="off"
          ></textarea>
        </div>

        <div class="code-statusbar">
          <div class="code-metrics" aria-label="内容统计">
            <span><strong id="line-count">1</strong> 行</span>
            <span><strong id="char-count">0</strong> 字符</span>
            <span><strong id="byte-count">0</strong> 字节</span>
          </div>
          <div class="code-feedback" id="code-feedback" role="status" aria-live="polite">等待选择或新建代码</div>
        </div>
      </section>
    </section>

    <p class="code-security-note" id="code-helper">公开可编辑 · 请勿保存密码或密钥。</p>
  </main>

  <footer class="site-footer">
    <span>© <span data-current-year></span> 日常信息台</span>
    <span>公共代码库</span>
  </footer>

  <script src="./assets/js/common.js?v=20261030-1"></script>
  <script src="./assets/js/supabase-config.js?v=20261030-1"></script>
  <script src="./assets/js/code-transfer.js?v=20261030-1"></script>
</body>
</html>
