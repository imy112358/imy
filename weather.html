<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="查询城市实时天气、空气质量、日出日落和生活指数。">
  <meta name="color-scheme" content="light dark">
  <title>今日天气 | 日常信息台</title>
  <link rel="stylesheet" href="./assets/css/site.css?v=20261030-ui">
  <link rel="stylesheet" href="./assets/css/workspace.css?v=20261030-ui">
  <script src="./assets/js/navigation.js?v=20261030-ui" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header" data-site-navigation></header>

  <main id="main" class="page">
    <header class="page-head reveal">
      <div class="page-head-copy">
        <a class="back-link" href="./index.html">返回首页</a>
        <h1 class="page-title">今日天气</h1>
      </div>
      <div class="page-actions">
        <form class="city-form" id="city-form" role="search">
          <label class="visually-hidden" for="city-input">城市名称</label>
          <input class="city-input" id="city-input" name="city" type="search" autocomplete="address-level2" placeholder="输入城市，如杭州" maxlength="20">
          <button class="button" type="submit">查询</button>
        </form>
      </div>
    </header>

    <section id="weather-content" aria-live="polite">
      <article class="panel feature-card">
        <div class="state">
          <div class="skeleton skeleton-line short"></div>
          <div class="skeleton" style="width: 52%; height: 120px"></div>
          <div class="skeleton skeleton-line"></div>
        </div>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <span>© <span data-current-year></span> 日常信息台</span>
    <span>天气数据来自 <a href="https://60s.viki.moe" target="_blank" rel="noreferrer">VikiMoe 60s</a></span>
  </footer>

  <script src="./assets/js/common.js"></script>
  <script src="./assets/js/weather.js"></script>
</body>
</html>
